<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
  <title>ClockForClaude — copy the time block</title>
  <meta name="description" content="Generate a real-time context block (date, time, timezone, weather) and copy it into the Claude app." />
  <meta name="theme-color" content="#1A1611" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#FAF7F2;--ink:#1A1611;--orange:#E8743A;--orange-dk:#C95D2A;--orange-lt:#FEF0E6;--muted:#8B7355;--border:#E8E0D4;--green:#3DAA6E;--sans:'Inter',system-ui,sans-serif;--serif:'Newsreader',Georgia,serif}
    body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);overflow-x:hidden}
    .wrap{max-width:460px;margin:0 auto;padding:22px 18px 40px}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:10px}
    .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;letter-spacing:-.3px}
    .logo b{color:var(--orange)}
    .mk{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--orange);display:flex;align-items:center;justify-content:center;font-size:18px}
    .langSel{font-family:inherit;font-size:13px;font-weight:700;color:var(--muted);background:#fff;border:1px solid var(--border);border-radius:8px;padding:7px 8px;cursor:pointer}
    h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;letter-spacing:-.6px;margin-bottom:6px}
    .sub{font-size:14px;color:var(--muted);margin-bottom:20px}
    .blk{background:var(--ink);color:#EDE6DB;font-family:ui-monospace,monospace;font-size:13px;line-height:1.85;padding:18px;border-radius:16px;white-space:pre-wrap;word-break:break-word;box-shadow:0 12px 36px rgba(60,40,20,.14)}
    .blk .tag{color:#F4915E;font-weight:700}.blk .k{color:#9a8b78}
    .btn{width:100%;font-family:inherit;font-size:16px;font-weight:700;border:none;border-radius:14px;padding:16px;cursor:pointer;transition:transform .1s,background .15s}
    .btn:active{transform:scale(.98)}
    .copy{background:var(--orange);color:#fff;margin-top:16px;box-shadow:0 8px 22px rgba(232,116,58,.3)}
    .copy.ok{background:var(--green)}
    .gps{background:var(--orange-lt);color:var(--orange-dk);border:1px solid rgba(232,116,58,.25);margin-top:10px;font-size:14px;padding:13px}
    .status{text-align:center;font-size:12.5px;color:var(--muted);min-height:16px;margin-top:10px}
    .hint{margin-top:24px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:13px 15px;font-size:13px;color:var(--muted);line-height:1.5}
    .hint b{color:var(--ink)}
    footer{text-align:center;margin-top:26px;font-size:12px;color:var(--muted)}
    footer a{color:var(--orange);text-decoration:none}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="logo"><span class="mk">🕐</span>Clock<b>ForClaude</b></span>
      <select class="langSel" id="langSel" aria-label="Language">
        <option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option>
        <option value="it">IT</option><option value="de">DE</option><option value="pt">PT</option><option value="zh">中文</option>
      </select>
    </header>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="blk" id="blk"></div>
    <button class="btn copy" id="copyBtn"></button>
    <button class="btn gps" id="gpsBtn"></button>
    <div class="status" id="status"></div>
    <div class="hint" id="hint"></div>
    <footer><a href="/">clockforclaude.com</a></footer>
  </div>

  <script>
  (function(){
    const T = {
      fr:{loc:'fr-FR',h1:"Copiez le bloc horaire",sub:"Touchez « Copier », puis collez-le au début de votre message dans l'app Claude.",copy:"📋 Copier le bloc",copied:"✓ Copié !",gps:"📡 Ajouter ma météo locale",gpsLoading:"Localisation…",gpsOk:"✓ Météo ajoutée",gpsDenied:"Permission refusée",gpsErr:"Position indisponible",moments:['Matin','Midi','Après-midi','Soirée','Nuit'],L:{t1:'[Horodatage système]',date:'Date',time:'Heure',tz:'Fuseau',moment:'Moment',jo:'Jour ouvré',hb:'Heures de bureau',weather:'Météo',t2:'[/Horodatage système]',yes:'Oui',no:'Non',open:'Ouvert',closed:'Fermé'},cats:['Ciel dégagé','Nuageux','Brouillard','Pluie','Neige','Orage'],hint:"<b>Astuce :</b> installe cette page sur ton écran d'accueil. <b>iPhone</b> (Safari) : <b>Partager</b> → « Sur l'écran d'accueil ». <b>Android</b> (Chrome) : menu <b>⋮</b> → « Ajouter à l'écran d'accueil ». Elle s'ouvre comme une app."},
      en:{loc:'en-US',h1:"Copy the time block",sub:"Tap “Copy”, then paste it at the start of your message in the Claude app.",copy:"📋 Copy the block",copied:"✓ Copied!",gps:"📡 Add my local weather",gpsLoading:"Locating…",gpsOk:"✓ Weather added",gpsDenied:"Permission denied",gpsErr:"Location unavailable",moments:['Morning','Midday','Afternoon','Evening','Night'],L:{t1:'[System timestamp]',date:'Date',time:'Time',tz:'Timezone',moment:'Moment',jo:'Working day',hb:'Office hours',weather:'Weather',t2:'[/System timestamp]',yes:'Yes',no:'No',open:'Open',closed:'Closed'},cats:['Clear sky','Cloudy','Fog','Rain','Snow','Thunderstorm'],hint:"<b>Tip:</b> install this page on your home screen. <b>iPhone</b> (Safari): <b>Share</b> → “Add to Home Screen”. <b>Android</b> (Chrome): menu <b>⋮</b> → “Add to Home screen”. It opens like an app."},
      es:{loc:'es-ES',h1:"Copia el bloque horario",sub:"Toca «Copiar» y pégalo al principio de tu mensaje en la app de Claude.",copy:"📋 Copiar el bloque",copied:"✓ ¡Copiado!",gps:"📡 Añadir mi clima local",gpsLoading:"Localizando…",gpsOk:"✓ Clima añadido",gpsDenied:"Permiso denegado",gpsErr:"Ubicación no disponible",moments:['Mañana','Mediodía','Tarde','Tarde-noche','Noche'],L:{t1:'[Marca de tiempo]',date:'Fecha',time:'Hora',tz:'Zona horaria',moment:'Momento',jo:'Día laborable',hb:'Horario de oficina',weather:'Tiempo',t2:'[/Marca de tiempo]',yes:'Sí',no:'No',open:'Abierto',closed:'Cerrado'},cats:['Despejado','Nublado','Niebla','Lluvia','Nieve','Tormenta'],hint:"<b>Consejo:</b> instala esta página en tu pantalla de inicio. <b>iPhone</b> (Safari): <b>Compartir</b> → «Añadir a inicio». <b>Android</b> (Chrome): menú <b>⋮</b> → «Añadir a pantalla principal». Se abre como una app."},
      it:{loc:'it-IT',h1:"Copia il blocco orario",sub:"Tocca «Copia», poi incollalo all'inizio del tuo messaggio nell'app Claude.",copy:"📋 Copia il blocco",copied:"✓ Copiato!",gps:"📡 Aggiungi il meteo locale",gpsLoading:"Localizzazione…",gpsOk:"✓ Meteo aggiunto",gpsDenied:"Permesso negato",gpsErr:"Posizione non disponibile",moments:['Mattina','Mezzogiorno','Pomeriggio','Sera','Notte'],L:{t1:'[Timestamp di sistema]',date:'Data',time:'Ora',tz:'Fuso orario',moment:'Momento',jo:'Giorno lavorativo',hb:'Orario ufficio',weather:'Meteo',t2:'[/Timestamp di sistema]',yes:'Sì',no:'No',open:'Aperto',closed:'Chiuso'},cats:['Sereno','Nuvoloso','Nebbia','Pioggia','Neve','Temporale'],hint:"<b>Consiglio:</b> installa questa pagina nella schermata Home. <b>iPhone</b> (Safari): <b>Condividi</b> → «Aggiungi a Home». <b>Android</b> (Chrome): menu <b>⋮</b> → «Aggiungi a schermata Home». Si apre come un'app."},
      de:{loc:'de-DE',h1:"Zeitblock kopieren",sub:"Tippe auf „Kopieren“ und füge ihn am Anfang deiner Nachricht in der Claude-App ein.",copy:"📋 Block kopieren",copied:"✓ Kopiert!",gps:"📡 Lokales Wetter hinzufügen",gpsLoading:"Standort…",gpsOk:"✓ Wetter hinzugefügt",gpsDenied:"Zugriff verweigert",gpsErr:"Standort nicht verfügbar",moments:['Morgen','Mittag','Nachmittag','Abend','Nacht'],L:{t1:'[System-Zeitstempel]',date:'Datum',time:'Uhrzeit',tz:'Zeitzone',moment:'Moment',jo:'Werktag',hb:'Bürozeiten',weather:'Wetter',t2:'[/System-Zeitstempel]',yes:'Ja',no:'Nein',open:'Offen',closed:'Geschlossen'},cats:['Klar','Bewölkt','Nebel','Regen','Schnee','Gewitter'],hint:"<b>Tipp:</b> Füge diese Seite zum Startbildschirm hinzu. <b>iPhone</b> (Safari): <b>Teilen</b> → „Zum Home-Bildschirm“. <b>Android</b> (Chrome): Menü <b>⋮</b> → „Zum Startbildschirm“. Sie öffnet sich wie eine App."},
      pt:{loc:'pt-PT',h1:"Copie o bloco de hora",sub:"Toque em «Copiar» e cole no início da sua mensagem na app Claude.",copy:"📋 Copiar o bloco",copied:"✓ Copiado!",gps:"📡 Adicionar o meu clima local",gpsLoading:"A localizar…",gpsOk:"✓ Clima adicionado",gpsDenied:"Permissão negada",gpsErr:"Localização indisponível",moments:['Manhã','Meio-dia','Tarde','Noite','Madrugada'],L:{t1:'[Carimbo de data/hora]',date:'Data',time:'Hora',tz:'Fuso horário',moment:'Momento',jo:'Dia útil',hb:'Horário comercial',weather:'Clima',t2:'[/Carimbo de data/hora]',yes:'Sim',no:'Não',open:'Aberto',closed:'Fechado'},cats:['Limpo','Nublado','Nevoeiro','Chuva','Neve','Trovoada'],hint:"<b>Dica:</b> instale esta página no ecrã principal. <b>iPhone</b> (Safari): <b>Partilhar</b> → «Adicionar ao ecrã principal». <b>Android</b> (Chrome): menu <b>⋮</b> → «Adicionar ao ecrã principal». Abre como uma app."},
      zh:{loc:'zh-CN',h1:"复制时间信息块",sub:"点击「复制」，然后粘贴到 Claude 应用中消息的开头。",copy:"📋 复制信息块",copied:"✓ 已复制！",gps:"📡 添加本地天气",gpsLoading:"定位中…",gpsOk:"✓ 已添加天气",gpsDenied:"权限被拒绝",gpsErr:"无法获取位置",moments:['早上','中午','下午','晚上','深夜'],L:{t1:'[系统时间戳]',date:'日期',time:'时间',tz:'时区',moment:'时段',jo:'工作日',hb:'办公时间',weather:'天气',t2:'[/系统时间戳]',yes:'是',no:'否',open:'营业中',closed:'已关闭'},cats:['晴朗','多云','雾','有雨','有雪','雷暴'],hint:"<b>提示：</b>将此页面添加到主屏幕。<b>iPhone</b>（Safari）：<b>分享</b> →「添加到主屏幕」。<b>Android</b>（Chrome）：菜单 <b>⋮</b> →「添加到主屏幕」。它会像应用一样打开。"}
    };
    let lang = (function(){ const l=(navigator.language||'en').slice(0,2).toLowerCase(); return T[l]?l:'en'; })();
    let coords=null, weatherCat=null;
    try{ const s=JSON.parse(localStorage.getItem('cfc_coords')||'null'); if(s) coords=s; }catch(e){}
    const pad=n=>String(n).padStart(2,'0'); const $=id=>document.getElementById(id);
    const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);

    function catIdx(c){ if(c<=1)return 0; if(c<=3)return 1; if(c===45||c===48)return 2; if((c>=51&&c<=67)||(c>=80&&c<=82))return 3; if((c>=71&&c<=77)||c===85||c===86)return 4; if(c>=95)return 5; return 1; }
    function tz(){ try{const z=Intl.DateTimeFormat().resolvedOptions().timeZone||'';const city=z.split('/').pop().replace(/_/g,' ');const o=-new Date().getTimezoneOffset();const s=o>=0?'+':'-';const h=Math.floor(Math.abs(o)/60);const m=Math.abs(o)%60;return (city?city+' — ':'')+`UTC${s}${h}${m?':'+pad(m):''}`;}catch(e){return 'UTC';} }
    function momentIdx(h){ if(h>=5&&h<12)return 0; if(h>=12&&h<14)return 1; if(h>=14&&h<18)return 2; if(h>=18&&h<22)return 3; return 4; }

    function lines(){
      const t=T[lang], L=t.L, now=new Date(), d=now.getDay(), h=now.getHours();
      const dateStr=cap(now.toLocaleDateString(t.loc,{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
      const timeStr=now.toLocaleTimeString(t.loc,{hour:'2-digit',minute:'2-digit',hour12:false});
      const arr=[L.t1,`${L.date} : ${dateStr}`,`${L.time} : ${timeStr}`,`${L.tz} : ${tz()}`,`${L.moment} : ${t.moments[momentIdx(h)]}`,`${L.jo} : ${(d>=1&&d<=5)?L.yes:L.no}`,`${L.hb} : ${(d>=1&&d<=5&&h>=8&&h<18)?L.open:L.closed}`];
      if(weatherCat!=null && coords && coords.temp!=null) arr.push(`${L.weather} : ${coords.temp}°C, ${t.cats[weatherCat]}`);
      arr.push(L.t2);
      return arr;
    }
    function plain(){ return lines().join('\n'); }
    function html(){ return lines().map((ln,i,a)=>{ if(i===0||i===a.length-1)return `<span class="tag">${ln}</span>`; const idx=ln.indexOf(' : '); if(idx===-1)return ln; return `<span class="k">${ln.slice(0,idx+3)}</span>${ln.slice(idx+3)}`; }).join('\n'); }

    function render(){ const t=T[lang]; document.documentElement.lang=lang; $('langSel').value=lang; $('h1').textContent=t.h1; $('sub').textContent=t.sub; $('copyBtn').textContent=t.copy; $('gpsBtn').textContent=t.gps; $('hint').innerHTML=t.hint; $('blk').innerHTML=html(); }

    async function fetchWeather(){
      if(!coords) return;
      try{ const u=`https://api.open-meteo.com/v1/forecast?latitude=${coords.lat}&longitude=${coords.lon}&current=temperature_2m,weathercode`;
        const r=await fetch(u); const data=await r.json();
        if(data&&data.current){ coords.temp=Math.round(data.current.temperature_2m); weatherCat=catIdx(data.current.weathercode); localStorage.setItem('cfc_coords',JSON.stringify(coords)); render(); }
      }catch(e){}
    }

    $('copyBtn').addEventListener('click', async()=>{ const t=T[lang];
      try{ await navigator.clipboard.writeText(plain()); }
      catch(e){ const ta=document.createElement('textarea'); ta.value=plain(); document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
      const b=$('copyBtn'); b.classList.add('ok'); b.textContent=t.copied; setTimeout(()=>{b.classList.remove('ok');b.textContent=t.copy;},1600);
    });
    $('gpsBtn').addEventListener('click', ()=>{ const t=T[lang];
      if(!navigator.geolocation){ $('status').textContent=t.gpsErr; return; }
      $('status').textContent=t.gpsLoading;
      navigator.geolocation.getCurrentPosition(
        pos=>{ coords={lat:+pos.coords.latitude.toFixed(3),lon:+pos.coords.longitude.toFixed(3)}; $('status').textContent=t.gpsOk; fetchWeather(); },
        err=>{ $('status').textContent = err.code===1 ? t.gpsDenied : t.gpsErr; },
        {enableHighAccuracy:false,timeout:10000,maximumAge:600000}
      );
    });
    $('langSel').addEventListener('change', e=>{ lang=e.target.value; render(); });

    render(); if(coords) fetchWeather();
    setInterval(()=>{ $('blk').innerHTML=html(); }, 1000);
    if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
  })();
  </script>
</body>
</html>
